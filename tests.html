<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nić Ariadny – testy</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; background: #f4f1ea; color: #1f2a44; }
    h1 { margin-top: 0; }
    #summary { font-weight: 700; font-size: 1.2rem; margin-bottom: 1rem; }
    .pass { color: #0e7f5f; }
    .fail { color: #c0392b; }
    li { margin: 0.2rem 0; }
    pre { margin: 0.2rem 0 0.5rem 1.5rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Testy labiryntu</h1>
  <div id="summary">Uruchamianie…</div>
  <ul id="results"></ul>

  <script src="js/maze.js"></script>
  <script src="js/game.js"></script>
  <script src="js/guest.js"></script>
  <script src="js/input.js"></script>
  <script>
    (function () {
      'use strict';

      // Minimalny zestaw do testów – bez bibliotek.
      var tests = [];
      function test(name, fn) { tests.push({ name: name, fn: fn }); }
      function assert(cond, msg) { if (!cond) throw new Error(msg || 'asercja nie przeszła'); }
      function assertEqual(actual, expected, msg) {
        if (actual !== expected) throw new Error((msg || 'różne wartości') + ': oczekiwano ' + expected + ', jest ' + actual);
      }

      var SEEDS = [];
      for (var s = 1; s <= 40; s++) SEEDS.push(s * 7919);
      var SIZES = Object.keys(DIFFICULTIES).map(function (k) { return DIFFICULTIES[k].size; });

      function forEachMaze(fn) {
        SIZES.forEach(function (size) {
          SEEDS.forEach(function (seed) {
            fn(Maze.generate(size, size, Maze.mulberry32(seed)), size, seed);
          });
        });
      }

      // Idzie po rozwiązaniu, zamieniając kolejne pola na kierunki ruchu.
      function directionsFor(path) {
        var dirs = [];
        for (var i = 1; i < path.length; i++) {
          var dx = path[i].x - path[i - 1].x, dy = path[i].y - path[i - 1].y;
          dirs.push(dx === 1 ? 'right' : dx === -1 ? 'left' : dy === 1 ? 'down' : 'up');
        }
        return dirs;
      }

      // ---- Generator ----

      test('Poziomy trudności mają rozmiary 10, 18 i 28', function () {
        assertEqual(DIFFICULTIES.easy.size, 10);
        assertEqual(DIFFICULTIES.medium.size, 18);
        assertEqual(DIFFICULTIES.hard.size, 28);
      });

      test('Istnieje droga od startu (lewy górny) do mety (prawy dolny)', function () {
        forEachMaze(function (maze, size, seed) {
          var path = Maze.solve(maze, { x: 0, y: 0 }, { x: size - 1, y: size - 1 });
          assert(path !== null, 'brak drogi, rozmiar ' + size + ', seed ' + seed);
          assertEqual(path[0].x + ',' + path[0].y, '0,0', 'początek drogi');
          assertEqual(path[path.length - 1].x + ',' + path[path.length - 1].y, (size - 1) + ',' + (size - 1), 'koniec drogi');
        });
      });

      test('Kolejne pola drogi sąsiadują i nie przechodzą przez ściany', function () {
        forEachMaze(function (maze, size) {
          var path = Maze.solve(maze, { x: 0, y: 0 }, { x: size - 1, y: size - 1 });
          var dirs = directionsFor(path);
          for (var i = 0; i < dirs.length; i++) {
            var dist = Math.abs(path[i + 1].x - path[i].x) + Math.abs(path[i + 1].y - path[i].y);
            assertEqual(dist, 1, 'odległość między polami drogi');
            assert(Maze.canMove(maze, path[i].x, path[i].y, dirs[i]), 'droga przechodzi przez ścianę');
          }
        });
      });

      test('Każde pole jest osiągalne ze startu', function () {
        forEachMaze(function (maze, size, seed) {
          assertEqual(Maze.reachableCount(maze, { x: 0, y: 0 }), size * size, 'osiągalne pola, seed ' + seed);
        });
      });

      test('Liczba przejść wynosi N−1 (labirynt idealny, bez pętli)', function () {
        forEachMaze(function (maze, size, seed) {
          assertEqual(Maze.countPassages(maze), size * size - 1, 'przejścia, seed ' + seed);
        });
      });

      test('Ściany są spójne po obu stronach', function () {
        forEachMaze(function (maze, size) {
          for (var y = 0; y < size; y++) {
            for (var x = 0; x < size; x++) {
              if (x + 1 < size) assertEqual(Maze.hasWall(maze, x, y, 'right'), Maze.hasWall(maze, x + 1, y, 'left'), 'ściana pionowa');
              if (y + 1 < size) assertEqual(Maze.hasWall(maze, x, y, 'down'), Maze.hasWall(maze, x, y + 1, 'up'), 'ściana pozioma');
            }
          }
        });
      });

      test('Obwód planszy jest zamknięty', function () {
        forEachMaze(function (maze, size) {
          for (var i = 0; i < size; i++) {
            assert(Maze.hasWall(maze, i, 0, 'up') && Maze.hasWall(maze, i, size - 1, 'down'), 'dziura w górnej/dolnej krawędzi');
            assert(Maze.hasWall(maze, 0, i, 'left') && Maze.hasWall(maze, size - 1, i, 'right'), 'dziura w lewej/prawej krawędzi');
          }
        });
      });

      test('Generator bez ziarna (Math.random) też daje poprawny labirynt', function () {
        for (var i = 0; i < 20; i++) {
          var maze = Maze.generate(28, 28);
          assertEqual(Maze.countPassages(maze), 28 * 28 - 1);
          assertEqual(Maze.reachableCount(maze, { x: 0, y: 0 }), 28 * 28);
        }
      });

      // ---- Gra ----

      test('Gracz nie przechodzi przez ściany, a uderzenie nie liczy się jako ruch', function () {
        var game = new Game('medium', 42);
        // Z lewego górnego rogu nie da się wyjść w górę ani w lewo.
        assertEqual(game.move('up', 0), 'blocked');
        assertEqual(game.move('left', 0), 'blocked');
        // Szukamy ściany wewnątrz planszy i próbujemy w nią wejść.
        var blocked = null;
        ['right', 'down'].forEach(function (d) { if (!blocked && !Maze.canMove(game.maze, 0, 0, d)) blocked = d; });
        if (blocked) assertEqual(game.move(blocked, 0), 'blocked');
        assertEqual(game.player.x + ',' + game.player.y, '0,0', 'pozycja po uderzeniu');
        assertEqual(game.moves, 0, 'ruchy po uderzeniu');
        assertEqual(game.startTime, null, 'czas nie startuje od uderzenia w ścianę');
      });

      test('Każdy krok w grze zgadza się z mapą ścian', function () {
        var game = new Game('easy', 7);
        var rng = Maze.mulberry32(99);
        for (var i = 0; i < 500 && game.status === 'playing'; i++) {
          var dir = Maze.DIR_NAMES[Math.floor(rng() * 4)];
          var before = { x: game.player.x, y: game.player.y };
          var allowed = Maze.canMove(game.maze, before.x, before.y, dir);
          var result = game.move(dir, i);
          if (allowed) assert(result === 'moved' || result === 'won', 'ruch dozwolony, a wynik: ' + result);
          else assertEqual(result, 'blocked', 'ruch przez ścianę');
          assert(Maze.inBounds(game.maze, game.player.x, game.player.y), 'gracz poza planszą');
        }
      });

      test('Wygrana wykrywa się na mecie, a potem ruchy są ignorowane', function () {
        ['easy', 'medium', 'hard'].forEach(function (diff) {
          var game = new Game(diff, 123);
          var dirs = directionsFor(Maze.solve(game.maze, game.start, game.goal));
          var t = 1000;
          for (var i = 0; i < dirs.length; i++) {
            var r = game.move(dirs[i], t += 100);
            assertEqual(r, i === dirs.length - 1 ? 'won' : 'moved', 'krok ' + i);
          }
          assertEqual(game.status, 'won');
          assertEqual(game.moves, dirs.length, 'liczba ruchów');
          assertEqual(game.elapsed(), (dirs.length - 1) * 100, 'czas od pierwszego ruchu do mety');
          assertEqual(game.move('left', t + 100), 'ignored');
        });
      });

      test('Ślad zapisuje przebytą drogę', function () {
        var game = new Game('easy', 5);
        var dirs = directionsFor(Maze.solve(game.maze, game.start, game.goal)).slice(0, 4);
        dirs.forEach(function (d, i) { game.move(d, i); });
        assertEqual(game.trail.length, 5);
        var last = game.trail[game.trail.length - 1];
        assertEqual(last.x + ',' + last.y, game.player.x + ',' + game.player.y);
      });

      test('Podpowiedź: 5 pól właściwej drogi, 2 sekundy, maksymalnie 3 razy', function () {
        var game = new Game('hard', 11);
        var path = Maze.solve(game.maze, game.start, game.goal);
        assert(game.useHint(0), 'pierwsza podpowiedź');
        assertEqual(game.hintCells.length, 5);
        for (var i = 0; i < 5; i++) {
          assertEqual(game.hintCells[i].x + ',' + game.hintCells[i].y, path[i + 1].x + ',' + path[i + 1].y, 'pole podpowiedzi ' + i);
        }
        assert(game.hintVisible(1999), 'widoczna przed upływem 2 s');
        assert(!game.hintVisible(2000), 'znika po 2 s');
        assert(game.useHint(0) && game.useHint(0), 'druga i trzecia podpowiedź');
        assertEqual(game.hintsLeft, 0);
        assert(!game.useHint(0), 'czwarta podpowiedź nie jest dostępna');
      });

      test('Podpowiedź przy mecie jest krótsza niż 5 pól', function () {
        var game = new Game('easy', 3);
        var dirs = directionsFor(Maze.solve(game.maze, game.start, game.goal));
        for (var i = 0; i < dirs.length - 2; i++) game.move(dirs[i], i);
        game.useHint(0);
        assertEqual(game.hintCells.length, 2);
      });

      test('Poddanie się pokazuje całą drogę i kończy grę', function () {
        var game = new Game('medium', 8);
        game.move(Maze.canMove(game.maze, 0, 0, 'right') ? 'right' : 'down', 0);
        assert(game.giveUp(500));
        assertEqual(game.status, 'gaveup');
        var sol = game.solution;
        assertEqual(sol[0].x + ',' + sol[0].y, '0,0');
        assertEqual(sol[sol.length - 1].x + ',' + sol[sol.length - 1].y, '17,17');
        assertEqual(game.move('right', 600), 'ignored');
        assert(!game.useHint(600), 'po poddaniu nie ma podpowiedzi');
      });

      test('Formatowanie czasu', function () {
        assertEqual(formatTime(0), '0:00.0');
        assertEqual(formatTime(9999), '0:09.9');
        assertEqual(formatTime(75300), '1:15.3');
      });

      // ---- Zapis i wznawianie ----

      function mazeKey(maze) {
        var s = '';
        for (var i = 0; i < maze.cells.length; i++) s += maze.cells[i].toString(16);
        return s;
      }

      test('Ten sam seed daje ten sam labirynt, a gra bez seeda losuje go sama', function () {
        assertEqual(mazeKey(new Game('medium', 12345).maze), mazeKey(new Game('medium', 12345).maze), 'labirynt z tego samego seeda');
        var g = new Game('easy');
        assert(typeof g.seed === 'number' && g.seed >= 0 && g.seed <= 4294967295 && g.seed === Math.floor(g.seed), 'losowy seed uint32: ' + g.seed);
        assertEqual(mazeKey(g.maze), mazeKey(new Game('easy', g.seed).maze), 'labirynt odtworzony z losowego seeda');
      });

      test('Ścieżka zapisuje tylko udane ruchy literami U D L R', function () {
        var game = new Game('easy', 5);
        var dirs = directionsFor(Maze.solve(game.maze, game.start, game.goal)).slice(0, 4);
        game.move('up', 0);   // ściany obwodu – bez zapisu
        game.move('left', 0);
        dirs.forEach(function (d, i) { game.move(d, i); });
        var expected = dirs.map(function (d) { return { up: 'U', down: 'D', left: 'L', right: 'R' }[d]; }).join('');
        assertEqual(game.path, expected);
        assertEqual(game.moves, game.path.length);
      });

      test('Wznowienie odtwarza labirynt, pozycję, nić, ruchy, czas i podpowiedzi', function () {
        var game = new Game('medium', 777);
        var dirs = directionsFor(Maze.solve(game.maze, game.start, game.goal)).slice(0, 12);
        dirs.forEach(function (d, i) { game.move(d, 1000 + i * 100); });
        game.useHint(2500);
        var snap = game.snapshot(5000);
        assertEqual(snap.elapsed_ms, 4000, 'czas w zapisie');
        var restored = Game.restore(snap, 20000);
        assertEqual(mazeKey(restored.maze), mazeKey(game.maze), 'labirynt');
        assertEqual(restored.player.x + ',' + restored.player.y, game.player.x + ',' + game.player.y, 'pozycja');
        assertEqual(JSON.stringify(restored.trail), JSON.stringify(game.trail), 'nić');
        assertEqual(restored.moves, 12, 'ruchy');
        assertEqual(restored.path, game.path, 'ścieżka');
        assertEqual(restored.elapsed(20000), 4000, 'czas po wznowieniu');
        assertEqual(restored.elapsed(21500), 5500, 'zegar biegnie dalej');
        assertEqual(restored.hintsUsed, 1, 'użyte podpowiedzi');
        assertEqual(restored.hintsLeft, 2, 'pozostałe podpowiedzi');
        assertEqual(restored.status, 'playing');
      });

      test('Wznowienie gry bez ruchów: zegar startuje dopiero od pierwszego ruchu', function () {
        var restored = Game.restore({ difficulty: 'easy', seed: 9, path: '', elapsed_ms: 0, hints_used: 0 }, 5000);
        assertEqual(restored.startTime, null);
        assertEqual(restored.elapsed(9000), 0);
      });

      test('Nie da się wznowić gry, której ścieżka kończy się na mecie albo nie pasuje do labiryntu', function () {
        var game = new Game('easy', 31);
        directionsFor(Maze.solve(game.maze, game.start, game.goal)).forEach(function (d, i) { game.move(d, i); });
        assertEqual(game.status, 'won');
        [game.path, 'UUU', 'X'].forEach(function (path) {
          var threw = false;
          try { Game.restore({ difficulty: 'easy', seed: 31, path: path, elapsed_ms: 1, hints_used: 0 }, 0); } catch (e) { threw = true; }
          assert(threw, 'ścieżka „' + path.slice(0, 8) + '” nie powinna dać się wznowić');
        });
      });

      test('Zapis zakończonej gry ma status i datę końca', function () {
        var game = new Game('easy', 4);
        game.move(Maze.canMove(game.maze, 0, 0, 'right') ? 'right' : 'down', 100);
        game.giveUp(900);
        var snap = game.snapshot(900);
        assertEqual(snap.status, 'gaveup');
        assert(snap.finished_at && snap.started_at <= snap.finished_at, 'daty');
        assertEqual(snap.moves, 1);
        assertEqual(new Game('easy', 4).snapshot().finished_at, null, 'gra w toku nie ma daty końca');
      });

      // ---- Wyniki gościa ----

      function memoryStorage() {
        var data = {};
        return {
          getItem: function (k) { return Object.prototype.hasOwnProperty.call(data, k) ? data[k] : null; },
          setItem: function (k, v) { data[k] = String(v); }
        };
      }
      function result(i, extra) {
        var r = { difficulty: 'easy', seed: i, path: 'R', moves: 1, elapsed_ms: 1000 + i, hints_used: 0, status: 'won',
                  started_at: '2026-10-13T10:00:00.000Z', finished_at: '2026-10-13T10:01:00.000Z' };
        for (var k in extra) r[k] = extra[k];
        return r;
      }

      test('Wyniki gościa: dodawanie, licznik i rekord tylko z wygranych', function () {
        var store = memoryStorage();
        var gr = GuestResults.create(function () { return store; });
        gr.add(result(1, { elapsed_ms: 9000 }));
        gr.add(result(2, { elapsed_ms: 4000, difficulty: 'medium' }));
        gr.add(result(3, { elapsed_ms: 2000, status: 'gaveup' }));
        gr.add(result(4, { elapsed_ms: 7000 }));
        assertEqual(gr.count(), 4);
        assertEqual(gr.best('easy'), 7000, 'rekord łatwego bez poddanej gry');
        assertEqual(gr.best('medium'), 4000);
        assertEqual(gr.best('hard'), null);
        var again = GuestResults.create(function () { return store; });
        assertEqual(again.count(), 4, 'wyniki przetrwały odświeżenie strony');
      });

      test('Wyniki gościa: najwyżej 20, najstarsze wypadają', function () {
        var store = memoryStorage();
        var gr = GuestResults.create(function () { return store; });
        for (var i = 1; i <= 23; i++) gr.add(result(i));
        var list = gr.list();
        assertEqual(list.length, 20);
        assertEqual(list[0].seed, 4, 'najstarszy zachowany');
        assertEqual(list[19].seed, 23, 'najnowszy');
      });

      test('Wyniki gościa: usuwanie po zapisie w bazie', function () {
        var store = memoryStorage();
        var gr = GuestResults.create(function () { return store; });
        gr.add(result(1)); gr.add(result(2)); gr.add(result(3));
        var ids = gr.list().map(function (r) { return r.id; });
        assert(ids[0] && ids[0] !== ids[1] && ids[1] !== ids[2], 'każdy wynik ma własne id');
        gr.remove([ids[0], ids[2]]);
        assertEqual(gr.count(), 1);
        assertEqual(gr.list()[0].seed, 2);
      });

      test('Wyniki gościa działają bez localStorage (tryb prywatny, blokada)', function () {
        var broken = { getItem: function () { throw new Error('blocked'); }, setItem: function () { throw new Error('blocked'); } };
        var gr = GuestResults.create(function () { return broken; });
        gr.add(result(1, { elapsed_ms: 3000 }));
        assertEqual(gr.count(), 1, 'wynik trzymany w pamięci');
        assertEqual(gr.best('easy'), 3000);
        var none = GuestResults.create(function () { throw new Error('no storage'); });
        none.add(result(2));
        assertEqual(none.count(), 1);
      });

      test('Wyniki gościa: uszkodzone dane w localStorage nie psują gry', function () {
        var store = memoryStorage();
        store.setItem('nic.guest-results', '{to nie jest json');
        var gr = GuestResults.create(function () { return store; });
        assertEqual(gr.count(), 0);
        gr.add(result(1));
        assertEqual(gr.count(), 1);
      });

      // ---- Sterowanie ----

      test('Pisanie w polach formularza nie porusza graczem ani nie wywołuje skrótów', function () {
        var moves = [], keys = [];
        Input.init({ onMove: function (d) { moves.push(d); }, onKey: function (e) { keys.push(e.key); } });
        var input = document.createElement('input');
        document.body.appendChild(input);
        ['w', 'a', 's', 'd', 'm', 'h', 'r'].forEach(function (k) {
          input.dispatchEvent(new KeyboardEvent('keydown', { key: k, code: 'Key' + k.toUpperCase(), bubbles: true }));
        });
        input.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowLeft', code: 'ArrowLeft', bubbles: true }));
        assertEqual(moves.length + keys.length, 0, 'zdarzenia z pola tekstowego');
        document.body.dispatchEvent(new KeyboardEvent('keydown', { key: 'w', code: 'KeyW', bubbles: true }));
        document.dispatchEvent(new KeyboardEvent('keyup', { key: 'w', code: 'KeyW', bubbles: true }));
        document.body.dispatchEvent(new KeyboardEvent('keydown', { key: 'm', code: 'KeyM', bubbles: true }));
        assertEqual(moves.join(','), 'up', 'ruch poza polem tekstowym');
        assertEqual(keys.join(','), 'm', 'skrót poza polem tekstowym');
        input.remove();
      });

      // ---- Uruchomienie ----

      var list = document.getElementById('results');
      var failed = 0;
      tests.forEach(function (t) {
        var li = document.createElement('li');
        try {
          t.fn();
          li.className = 'pass';
          li.textContent = '✔ ' + t.name;
        } catch (e) {
          failed++;
          li.className = 'fail';
          li.textContent = '✘ ' + t.name;
          var pre = document.createElement('pre');
          pre.textContent = e.message;
          li.appendChild(pre);
        }
        list.appendChild(li);
      });
      var summary = document.getElementById('summary');
      summary.className = failed ? 'fail' : 'pass';
      summary.textContent = failed
        ? 'Nie przeszło: ' + failed + ' z ' + tests.length
        : 'Wszystkie testy przeszły (' + tests.length + ')';
      document.title = (failed ? 'FAIL' : 'OK') + ' – testy labiryntu';
    })();
  </script>
</body>
</html>
